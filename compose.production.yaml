name: docsproject-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docsproject}
      POSTGRES_USER: ${POSTGRES_USER:-docsproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - database:/var/lib/postgresql/data
      - ./backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --root-path
      - /api
      - --proxy-headers
      - --forwarded-allow-ips
      - ${TRUSTED_PROXY_IPS:?Set the dedicated Caddy network CIDR in .env.production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      database:
      proxy:
        aliases: [docsproject-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - "/tmp:size=64m,noexec,nosuid"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    networks:
      proxy:
        aliases: [docsproject-web]
    read_only: true
    tmpfs:
      - "/tmp:size=16m,noexec,nosuid"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

volumes:
  database:

networks:
  database:
    internal: true
  proxy:
    external: true
    name: ${CADDY_NETWORK:-docsproject_proxy}
